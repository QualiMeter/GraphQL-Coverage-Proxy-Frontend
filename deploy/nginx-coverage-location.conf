# Add ONLY inside the existing 443 ssl server block with
# server_name graphql.rebyte.fun; do not create another server block.
#
# Before enabling: /var/www/coverage must be a symlink to
# /var/www/coverage-frontend/current, whose index.html already exists.

location = /coverage {
    return 301 /coverage/;
}

location ^~ /coverage/ {
    root /var/www;
    index index.html;
    try_files $uri $uri/ /coverage/index.html;
}
